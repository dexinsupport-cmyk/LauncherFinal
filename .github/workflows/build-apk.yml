name: Build APK from ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_DIR: extracted/SAMP-Mobile-GTA-2.11

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: List repo contents (debug)
        run: |
          echo "Files in repo root:"
          ls -la

      - name: Find and extract project zip
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No .zip file found in repo!"
            exit 1
          fi
          echo "Found zip: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted
          echo "Extracted contents:"
          ls -la "$PROJECT_DIR"

      - name: Auto-fix case-sensitive include mismatches
        run: |
          python3 - <<'PYEOF'
          import os, re

          cpp_root = os.path.join(os.environ["PROJECT_DIR"], "app", "src", "main", "cpp")

          all_files = []
          for dirpath, _, filenames in os.walk(cpp_root):
              for fn in filenames:
                  all_files.append(os.path.join(dirpath, fn))

          lower_index = {}
          for f in all_files:
              lower_index.setdefault(f.lower(), []).append(f)

          extra_bases = [
              os.path.join(cpp_root, "samp"),
              os.path.join(cpp_root, "samp", "util"),
              os.path.join(cpp_root, "samp", "vendor"),
              os.path.join(cpp_root, "samp", "vendor", "armhook"),
              os.path.join(cpp_root, "samp", "vendor", "imgui"),
              os.path.join(cpp_root, "samp", "game", "RW"),
              os.path.join(cpp_root, "samp", "game", "Core"),
              os.path.join(cpp_root, "opus", "include"),
          ]

          include_re = re.compile(r'#include\s+"([^"]+)"')
          fixed = 0
          changed = False

          def repl(m, path):
              global changed, fixed
              inc = m.group(1)
              bases = [os.path.dirname(path)] + extra_bases
              if any(os.path.isfile(os.path.normpath(os.path.join(b, inc))) for b in bases):
                  return m.group(0)
              for b in bases:
                  cand = os.path.normpath(os.path.join(b, inc))
                  matches = lower_index.get(cand.lower())
                  if matches:
                      actual_rel = os.path.relpath(matches[0], b)
                      actual_rel = actual_rel.replace(os.sep, "/")
                      print(f"Fixing include in {path}: \"{inc}\" -> \"{actual_rel}\"")
                      changed = True
                      fixed += 1
                      return f'#include "{actual_rel}"'
              return m.group(0)

          for path in all_files:
              if not path.endswith((".cpp", ".h", ".hpp", ".c", ".cc")):
                  continue
              try:
                  with open(path, "r", encoding="utf-8", errors="ignore") as fh:
                      text = fh.read()
              except Exception:
                  continue

              changed = False
              new_text = include_re.sub(lambda m: repl(m, path), text)
              if changed:
                  with open(path, "w", encoding="utf-8") as fh:
                      fh.write(new_text)

          print(f"\nTotal includes auto-fixed: {fixed}")
          PYEOF

      - name: Remove duplicate prebuilt .so files from jniLibs
        run: |
          rm -fv "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libbass.so"
          rm -fv "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libbass_ssl.so"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install required SDK components
        run: |
          sdkmanager --install "platforms;android-36"
          sdkmanager --install "build-tools;36.0.0"
          sdkmanager --install "ndk;26.2.11394342"
          sdkmanager --install "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Grant execute permission for gradlew
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA-2.11-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
